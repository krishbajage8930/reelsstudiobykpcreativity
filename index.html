  <style>
    :root {
      --black: #000000;
      --dark: #06050b;
      --dark-2: #0e0b16;
      --violet: #7D39EB;
      --lime: #C6FF33;
      --white: #FFFFFF;
      --muted: #bdb7cb;
      --glass: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.13);
      --shadow: 0 24px 80px rgba(125, 57, 235, 0.25);
      --radius: 24px;
      --max: 1180px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(125, 57, 235, 0.22), transparent 32%),
        radial-gradient(circle at 80% 12%, rgba(198, 255, 51, 0.12), transparent 28%),
        linear-gradient(180deg, #000000 0%, #07040f 48%, #000000 100%);
      color: var(--white);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent 80%);
      z-index: -3;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(90deg, rgba(255,255,255,0.025), transparent 20%, transparent 80%, rgba(255,255,255,0.025));
      mix-blend-mode: overlay;
      z-index: 9999;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .container {
      width: min(var(--max), calc(100% - 32px));
      margin: 0 auto;
    }

    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.18;
      z-index: -2;
      background:
        radial-gradient(circle at 12% 18%, rgba(255,255,255,.7) 0 1px, transparent 2px),
        radial-gradient(circle at 80% 24%, rgba(255,255,255,.6) 0 1px, transparent 2px),
        radial-gradient(circle at 45% 78%, rgba(198,255,51,.75) 0 1px, transparent 2px),
        radial-gradient(circle at 92% 70%, rgba(125,57,235,.9) 0 1px, transparent 2px);
      background-size: 120px 120px, 180px 180px, 230px 230px, 280px 280px;
      animation: drift 18s linear infinite;
    }

    @keyframes drift {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-80px, 60px, 0); }
    }

    /* Loader */
    .loader {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #000;
      z-index: 99999;
      transition: opacity .5s ease, visibility .5s ease;
    }

    .loader.hide {
      opacity: 0;
      visibility: hidden;
    }

    .loader-card {
      text-align: center;
      width: min(360px, 90vw);
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(255,255,255,0.04);
      box-shadow: var(--shadow);
    }

    .loader-logo {
      width: 96px;
      height: 96px;
      object-fit: cover;
      border-radius: 22px;
      margin: 0 auto 18px;
      border: 1px solid rgba(255,255,255,.18);
    }

    .loader-title {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: .05em;
    }

    .loader-line {
      height: 4px;
      width: 100%;
      margin-top: 18px;
      border-radius: 99px;
      background: rgba(255,255,255,.12);
      overflow: hidden;
    }

    .loader-line span {
      display: block;
      width: 45%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--violet), var(--lime));
      animation: loadMove 1s ease-in-out infinite;
    }

    @keyframes loadMove {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(240%); }
    }

    /* Navbar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(18px);
      background: rgba(0,0,0,.65);
      border-bottom: 1px solid rgba(255,255,255,.09);
    }

    .nav-inner {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: max-content;
    }

    .brand img {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.16);
    }

    .brand-text {
      display: grid;
      line-height: 1.1;
    }

    .brand-text strong {
      font-size: 1rem;
      letter-spacing: .01em;
    }

    .brand-text span {
      font-size: .78rem;
      color: var(--muted);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 18px;
      color: rgba(255,255,255,.78);
      font-size: .9rem;
      font-weight: 600;
    }

    .nav-links a:hover {
      color: var(--lime);
    }

    .nav-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: max-content;
      padding: 12px 16px;
      border-radius: 999px;
      color: #050505;
      background: var(--lime);
      font-weight: 900;
      box-shadow: 0 10px 30px rgba(198,255,51,.18);
    }

    .menu-btn {
      display: none;
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--glass);
      color: var(--white);
      font-size: 1.4rem;
    }

    /* General */
    section {
      padding: 90px 0;
      position: relative;
    }

    .section-head {
      margin-bottom: 38px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
    }

    .eyebrow {
      color: var(--lime);
      font-weight: 900;
      letter-spacing: .18em;
      text-transform: uppercase;
      font-size: .78rem;
      margin-bottom: 12px;
    }

    h1, h2, h3 {
      letter-spacing: -0.04em;
    }

    h1 {
      font-size: clamp(2.8rem, 8vw, 7.2rem);
      line-height: .9;
      max-width: 970px;
    }

    h2 {
      font-size: clamp(2rem, 4vw, 4rem);
      line-height: 1;
    }

    h3 {
      font-size: 1.25rem;
    }

    .gradient-text {
      background: linear-gradient(90deg, #ffffff, #cfc3ff 40%, var(--lime));
      -webkit-background-clip: text;
      color: transparent;
    }

    .text-muted {
      color: var(--muted);
      line-height: 1.75;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      border-radius: 999px;
      font-weight: 900;
      border: 1px solid transparent;
      transition: .25s ease;
    }

    .btn-primary {
      background: var(--lime);
      color: #050505;
      box-shadow: 0 18px 42px rgba(198,255,51,.15);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 24px 60px rgba(198,255,51,.24);
    }

    .btn-secondary {
      background: rgba(255,255,255,.06);
      color: var(--white);
      border-color: var(--border);
    }

    .btn-secondary:hover {
      border-color: rgba(198,255,51,.45);
      color: var(--lime);
    }

    .book-cta {
      margin-top: 34px;
      padding: 26px;
      border: 1px solid rgba(198,255,51,.25);
      background:
        linear-gradient(135deg, rgba(125,57,235,.18), rgba(198,255,51,.07)),
        rgba(255,255,255,.04);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .book-cta strong {
      display: block;
      font-size: 1.25rem;
      margin-bottom: 6px;
    }

    /* Hero */
    .hero {
      min-height: calc(100vh - 76px);
      display: flex;
      align-items: center;
      padding: 84px 0 60px;
      overflow: hidden;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.08fr .92fr;
      align-items: center;
      gap: 42px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      margin-bottom: 24px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.13);
      background: rgba(255,255,255,.05);
      color: rgba(255,255,255,.82);
      font-weight: 700;
      font-size: .9rem;
    }

    .pulse {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--lime);
      box-shadow: 0 0 0 0 rgba(198,255,51,.65);
      animation: pulse 1.7s infinite;
    }

    @keyframes pulse {
      70% { box-shadow: 0 0 0 14px rgba(198,255,51,0); }
      100% { box-shadow: 0 0 0 0 rgba(198,255,51,0); }
    }

    .hero p {
      max-width: 650px;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.18rem);
      line-height: 1.8;
      margin-top: 24px;
    }

    .hero-card {
      position: relative;
      border-radius: 36px;
      border: 1px solid rgba(255,255,255,.15);
      padding: 18px;
      background: rgba(255,255,255,.05);
      box-shadow: var(--shadow);
      transform-style: preserve-3d;
      animation: floatCard 5s ease-in-out infinite;
    }

    @keyframes floatCard {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-14px) rotate(1deg); }
    }

    .hero-card::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      background: conic-gradient(from 120deg, transparent, var(--violet), var(--lime), transparent 30%);
      opacity: .35;
      z-index: -1;
      filter: blur(12px);
    }

    .logo-frame {
      overflow: hidden;
      border-radius: 28px;
      background: #000;
      aspect-ratio: 4 / 5;
      display: grid;
      place-items: center;
    }

    .logo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: .93;
      transform: scale(1.02);
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 18px;
    }

    .stat {
      padding: 16px;
      border-radius: 20px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
    }

    .stat strong {
      font-size: 1.4rem;
      display: block;
      color: var(--lime);
    }

    .stat span {
      font-size: .78rem;
      color: var(--muted);
    }

    .orb {
      position: absolute;
      border-radius: 999px;
      filter: blur(28px);
      opacity: .55;
      pointer-events: none;
    }

    .orb-one {
      width: 180px;
      height: 180px;
      background: var(--violet);
      top: 18%;
      right: 12%;
      animation: orbMove 8s ease-in-out infinite;
    }

    .orb-two {
      width: 120px;
      height: 120px;
      background: var(--lime);
      bottom: 18%;
      left: 5%;
      animation: orbMove 10s ease-in-out infinite reverse;
    }

    @keyframes orbMove {
      50% { transform: translate(28px, -22px) scale(1.12); }
    }

    /* Moving banner */
    .marquee {
      overflow: hidden;
      border-block: 1px solid rgba(255,255,255,.1);
      background: linear-gradient(90deg, rgba(125,57,235,.2), rgba(198,255,51,.08));
      padding: 18px 0;
      white-space: nowrap;
    }

    .marquee-track {
      display: inline-flex;
      gap: 28px;
      animation: marquee 22s linear infinite;
    }

    .marquee span {
      font-weight: 1000;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: rgba(255,255,255,.9);
    }

    .marquee b {
      color: var(--lime);
      margin-left: 28px;
    }

    @keyframes marquee {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    /* Cards */
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .card {
      position: relative;
      overflow: hidden;
      min-height: 180px;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background:
        linear-gradient(135deg, rgba(255,255,255,.08), rgba(255,255,255,.03)),
        rgba(255,255,255,.03);
      transition: .25s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(198,255,51,.35);
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }

    .card::after {
      content: "";
      position: absolute;
      width: 140px;
      height: 140px;
      right: -70px;
      top: -70px;
      background: radial-gradient(circle, rgba(125,57,235,.45), transparent 68%);
      transition: .25s ease;
    }

    .card:hover::after {
      transform: scale(1.4);
      background: radial-gradient(circle, rgba(198,255,51,.34), transparent 68%);
    }

    .icon {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      margin-bottom: 20px;
      background: rgba(125,57,235,.20);
      border: 1px solid rgba(125,57,235,.45);
      color: var(--lime);
      font-size: 1.45rem;
    }

    .card p {
      color: var(--muted);
      line-height: 1.7;
      margin-top: 10px;
      font-size: .95rem;
    }

    /* Categories */
    .category-card {
      cursor: pointer;
      min-height: 150px;
    }

    .category-card.active {
      border-color: var(--lime);
      background: linear-gradient(135deg, rgba(198,255,51,.12), rgba(125,57,235,.12));
    }

    .category-view {
      margin-top: 24px;
      padding: 26px;
      border-radius: var(--radius);
      border: 1px solid rgba(198,255,51,.22);
      background: rgba(255,255,255,.045);
    }

    .category-view-top {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 18px;
    }

    .work-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 18px;
    }

    .work-card {
      min-height: 230px;
      border: 1px dashed rgba(255,255,255,.22);
      border-radius: 22px;
      background:
        linear-gradient(135deg, rgba(125,57,235,.12), rgba(198,255,51,.05)),
        rgba(255,255,255,.035);
      overflow: hidden;
    }

    .work-thumb {
      height: 140px;
      display: grid;
      place-items: center;
      color: rgba(255,255,255,.7);
      font-weight: 900;
      background:
        radial-gradient(circle at 25% 20%, rgba(198,255,51,.18), transparent 30%),
        radial-gradient(circle at 80% 70%, rgba(125,57,235,.35), transparent 35%),
        #07070a;
    }


    .work-thumb.has-video {
      padding: 0;
      background: #000;
    }

    .work-thumb video,
    .work-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .work-info {
      padding: 16px;
    }

    .work-info span {
      display: inline-flex;
      margin-top: 8px;
      color: var(--lime);
      font-weight: 800;
      font-size: .82rem;
    }

    /* Packages */
    .package {
      min-height: 330px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .package-label {
      display: inline-flex;
      width: fit-content;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(198,255,51,.12);
      border: 1px solid rgba(198,255,51,.25);
      color: var(--lime);
      font-weight: 900;
      font-size: .8rem;
      margin-bottom: 18px;
    }

    .package ul {
      list-style: none;
      display: grid;
      gap: 12px;
      margin-top: 20px;
      color: var(--muted);
    }

    .package li::before {
      content: "✓";
      color: var(--lime);
      font-weight: 900;
      margin-right: 10px;
    }

    .hidden-price {
      margin-top: 22px;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(125,57,235,.16);
      border: 1px solid rgba(125,57,235,.35);
      color: rgba(255,255,255,.85);
      font-weight: 800;
    }

    /* Process */
    .process {
      counter-reset: process;
    }

    .process-card {
      min-height: 210px;
    }

    .process-card::before {
      counter-increment: process;
      content: "0" counter(process);
      position: absolute;
      right: 20px;
      top: 14px;
      font-size: 4rem;
      line-height: 1;
      color: rgba(255,255,255,.07);
      font-weight: 1000;
    }

    /* Proof */
    .proof-card {
      min-height: 260px;
    }

    .proof-box {
      min-height: 140px;
      border-radius: 20px;
      border: 1px dashed rgba(255,255,255,.20);
      background: rgba(0,0,0,.25);
      display: grid;
      place-items: center;
      text-align: center;
      padding: 20px;
      color: rgba(255,255,255,.62);
      font-weight: 800;
      margin-bottom: 16px;
    }

    .testimonial {
      min-height: auto;
    }

    .stars {
      color: var(--lime);
      letter-spacing: .08em;
      margin-bottom: 14px;
    }

    /* About */
    .split {
      display: grid;
      grid-template-columns: .95fr 1.05fr;
      gap: 28px;
      align-items: center;
    }

    .about-media {
      padding: 18px;
      border-radius: 34px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.05);
    }

    .about-media img {
      border-radius: 26px;
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
    }

    .about-list {
      display: grid;
      gap: 14px;
      margin-top: 26px;
    }

    .about-list div {
      padding: 16px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.045);
      color: rgba(255,255,255,.82);
      font-weight: 700;
    }

    .about-list span {
      color: var(--lime);
      margin-right: 8px;
    }

    /* FAQ */
    .faq-list {
      d
